<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050912">
<title>لوحة التحكم — Mhammed Shubair</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#050912;--panel:#0a1322;--panel2:#0e1a2e;--line:rgba(121,184,245,.16);--line2:rgba(121,184,245,.32);--txt:#e8f0fa;--mut:#8da4ba;--blue:#168cff;--cyan:#61d5ff;--red:#ff6b78;--green:#35d39a;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse 70% 40% at 50% 0,rgba(22,100,180,.2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;line-height:1.6;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cyan);text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
[hidden]{display:none!important}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:700;font-size:14px;transition:.2s}
.btn:hover{border-color:var(--cyan);background:rgba(97,213,255,.08)}
.btn.primary{background:linear-gradient(110deg,#0878e8,#28b7e9);border:0;color:#03101e}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 8px 24px rgba(22,140,255,.35)}
.btn.danger{color:var(--red);border-color:rgba(255,107,120,.35)}
.btn.danger:hover{background:rgba(255,107,120,.1);border-color:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;pointer-events:none}
.ibtn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.2s}
.ibtn:hover{border-color:var(--cyan);color:var(--cyan)}
.ibtn.danger:hover{border-color:var(--red);color:var(--red)}
.ibtn[disabled]{opacity:.3;pointer-events:none}
/* boot + login */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--cyan);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lcard h1{font-size:26px;font-weight:800;margin-bottom:4px}
.lcard p.sub{color:var(--mut);margin-bottom:24px;font-size:14px}
.err{color:var(--red);font-size:13.5px;margin:10px 0 0;min-height:20px}
.link{background:none;border:0;color:var(--cyan);font-size:13.5px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
/* layout */
#app{display:flex;min-height:100vh}
#side{width:260px;flex:0 0 260px;background:rgba(7,13,24,.92);border-inline-start:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;order:0}
.brand{font-weight:800;font-size:19px;padding:6px 12px 2px;letter-spacing:-.01em}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--mut)}
#side nav{display:flex;flex-direction:column;gap:3px;margin-top:18px}
.nv{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:11px 14px;border-radius:12px;border:1px solid transparent;background:none;color:#b7c7da;font-weight:600;font-size:15px;transition:.2s}
.nv:hover{background:rgba(255,255,255,.04);color:#fff}
.nv.on{background:linear-gradient(110deg,rgba(8,120,232,.28),rgba(40,183,233,.14));border-color:var(--line2);color:#fff}
.side-foot{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:62px;padding:0 clamp(16px,3vw,34px);background:rgba(5,9,18,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h2{font-size:19px;font-weight:800;flex:1}
#burger{display:none}
.dirty{display:none;align-items:center;gap:7px;font-size:12.5px;color:#ffc46b}
.dirty:before{content:"";width:8px;height:8px;border-radius:50%;background:#ffc46b}
.dirty.on{display:inline-flex}
#view{padding:clamp(16px,3vw,34px);max-width:980px;margin:0 auto;padding-bottom:110px}
/* cards & fields */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fld{margin-bottom:14px}.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:13.5px;font-weight:700;color:#b7c7da;margin-bottom:6px}
.fld small{display:block;color:var(--mut);font-size:12.5px;margin-top:5px}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],textarea,select{width:100%;background:#07101d;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(97,213,255,.12)}
textarea{resize:vertical;min-height:80px}
input[type=color]{width:46px;height:42px;border:1px solid var(--line);border-radius:10px;background:#07101d;padding:3px}
.ltr{direction:ltr;text-align:left}
.savebar{position:fixed;inset-inline:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:14px;background:linear-gradient(transparent,rgba(5,9,18,.95) 40%);pointer-events:none}
.savebar .btn{pointer-events:auto;min-width:230px;padding:13px 26px;font-size:15px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
@media(min-width:861px){.savebar{inset-inline-start:260px}}
/* switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;background:#07101d;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.sw b{font-weight:700;font-size:14.5px}
.sw input{display:none}
.sw i{width:44px;height:26px;border-radius:30px;background:#223149;position:relative;transition:.25s;flex:0 0 auto}
.sw i:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked+i{background:var(--blue)}
.sw input:checked+i:after{inset-inline-start:21px}
/* list editor */
.lrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.lrow .grow{flex:1;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.lrow input{padding:9px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chipx{display:inline-flex;align-items:center;gap:6px;padding:7px 8px 7px 14px;border-radius:30px;background:rgba(97,213,255,.08);border:1px solid var(--line2);font-size:14px;direction:ltr}
.chipx button{border:0;background:rgba(255,255,255,.08);color:#fff;width:22px;height:22px;border-radius:50%;line-height:1;font-size:14px}
.chipx button:hover{background:var(--red)}
.addrow{display:flex;gap:8px}
/* image field */
.imgf{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.imgf .pv{width:150px;height:110px;border-radius:14px;border:1px dashed var(--line2);background:#07101d center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:12.5px;text-align:center;overflow:hidden}
.imgf .pv.contain{background-size:contain}
.imgf .pv.chk{background-color:#0e1a2e}
.imgf .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.imgf .note{color:var(--mut);font-size:12.5px}
/* ticker / icons */
.strip{display:flex;gap:30px;justify-content:center;align-items:center;flex-wrap:wrap;padding:22px;border-radius:14px;background:#07101d;border:1px solid var(--line);color:#7d92a9;margin-bottom:16px}
.strip svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:#07101d;display:grid;place-items:center;color:var(--cyan);flex:0 0 auto}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.igrid button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:#07101d;display:grid;place-items:center;gap:2px;color:#b7c7da;transition:.2s;padding:6px}
.igrid button:hover,.igrid button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(97,213,255,.08)}
.igrid svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* works */
.wlist{display:flex;flex-direction:column;gap:12px}
.witem{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.witem.off{opacity:.55}
.wthumb{width:96px;height:64px;border-radius:12px;flex:0 0 auto;background:radial-gradient(circle at 70% 25%,var(--g,#1478b4),transparent 55%),linear-gradient(135deg,#142f48,#07101b 75%) center/cover;border:1px solid var(--line)}
.winfo{flex:1;min-width:0}
.winfo b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.winfo span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.wact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:rgba(255,196,107,.14);color:#ffc46b;margin-inline-start:6px;font-weight:700;vertical-align:middle}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:#fff}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1;background:linear-gradient(110deg,#0878e8,#61d5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mut);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--txt);font-weight:700;transition:.2s;text-align:start}
.tile:hover{border-color:var(--cyan);transform:translateY(-2px)}
.tile svg{color:var(--cyan)}
/* setup */
.steps{counter-reset:s;list-style:none;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;padding-inline-start:44px;position:relative;font-size:14.5px}
.steps li:before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:rgba(97,213,255,.12);border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;color:var(--cyan);font-size:14px}
pre.code{direction:ltr;text-align:left;background:#040a14;border:1px solid var(--line);border-radius:12px;padding:16px;font:13px/1.65 ui-monospace,Menlo,Consolas,monospace;overflow:auto;color:#bcd6f2;white-space:pre}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:30px;font-size:13px;font-weight:700}
.pill.ok{background:rgba(53,211,154,.12);color:var(--green)}
.pill.no{background:rgba(255,107,120,.12);color:var(--red)}
.pill.mid{background:rgba(255,196,107,.12);color:#ffc46b}
/* modal / toast */
#modal{position:fixed;inset:0;z-index:60;background:rgba(2,5,10,.72);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:22px 22px 0 0;padding:22px;animation:up .28s ease}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;inset-inline:0;bottom:84px;display:flex;justify-content:center;z-index:90;pointer-events:none}
#toast div{background:#12243b;border:1px solid var(--line2);padding:12px 22px;border-radius:30px;font-weight:700;font-size:14.5px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:up .25s ease;max-width:92vw;text-align:center}
#toast div.bad{border-color:var(--red);color:#ffd5d9}
#toast div.good{border-color:var(--green)}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.iconbtn img,.strip img,.igrid img{width:26px;height:26px;object-fit:contain}.mi{display:block;width:26px;height:26px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}.strip .mi{width:30px;height:30px}.strip img{width:30px;height:30px;filter:grayscale(1) brightness(1.2);opacity:.85}.prog{display:flex;align-items:center;gap:10px;margin-top:12px}.prog[hidden]{display:none}.prog .bar{flex:1;height:8px;border-radius:8px;background:#07101d;border:1px solid var(--line);overflow:hidden}.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(110deg,#0878e8,#28b7e9);transition:width .2s}.prog b{font-size:13px;min-width:38px;text-align:center}
/* mobile */
@media(max-width:860px){
 #app{display:block}
 #side{position:fixed;inset-block:0;inset-inline-start:0;z-index:50;width:min(300px,86vw);transform:translateX(105%);transition:transform .3s ease;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
 body.nav-open #side{transform:none}
 #scrim{position:fixed;inset:0;background:rgba(2,5,10,.6);z-index:45;display:none}
 body.nav-open #scrim{display:block}
 #burger{display:inline-grid}
 .stats{grid-template-columns:1fr 1fr}
 .grid2{grid-template-columns:1fr}
 .lrow:not(.nw){flex-wrap:wrap}.lrow .grow{grid-template-columns:1fr;flex:1 1 100%}.lrow.nw .grow{flex:1 1 0;min-width:0}.lrow.nw .ibtn{width:34px;height:34px}.lrow.nw{gap:6px}
 .witem{flex-wrap:wrap}.wact{width:100%;justify-content:flex-start}
}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div></div>

<section id="login" hidden>
 <div class="lcard">
  <h1>لوحة التحكم</h1>
  <p class="sub">Mhammed Shubair — سجّل دخولك لإدارة الموقع</p>
  <form id="lform" novalidate>
   <div class="fld"><label for="lem">البريد الإلكتروني</label><input id="lem" type="email" class="ltr" autocomplete="username" inputmode="email"></div>
   <div class="fld"><label for="lpw">كلمة المرور</label><input id="lpw" type="password" class="ltr" autocomplete="current-password"></div>
   <button class="btn primary" id="lbtn" style="width:100%;margin-top:6px" type="submit">دخول</button>
   <p class="err" id="lerr"></p>
   <button class="link" id="lreset" type="button">نسيت كلمة المرور؟</button>
  </form>
 </div>
</section>

<div id="app" hidden>
 <aside id="side">
  <div class="brand">Mhammed Shubair<small>لوحة تحكم الموقع</small></div>
  <nav id="nav"></nav>
  <div class="side-foot">
   <a class="btn" href="https://mohammmed99-portfolio.vercel.app/#contact" target="_blank" rel="noopener">عرض الموقع</a>
   <button class="btn danger" id="logout" type="button">تسجيل الخروج</button>
  </div>
 </aside>
 <div id="scrim"></div>
 <div id="main">
  <header class="top">
   <button class="ibtn" id="burger" type="button" aria-label="القائمة"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
   <h2 id="ptitle"></h2>
   <span class="dirty" id="dirty">تغييرات غير محفوظة</span>
  </header>
  <div id="view"></div>
 </div>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script type="module">

/* ================= Firestore over REST (fast, no streaming connection) ================= */
function makeRest(){
 const BASE=`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents`;
 const enc=v=>v===null||v===undefined?{nullValue:null}:typeof v==='boolean'?{booleanValue:v}:typeof v==='number'?(Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v}):typeof v==='string'?{stringValue:v}:Array.isArray(v)?{arrayValue:{values:v.map(enc)}}:{mapValue:{fields:encF(v)}};
 const encF=o=>{const f={};for(const k in o){if(o[k]!==undefined)f[k]=enc(o[k])}return f};
 const dec=v=>!v?null:'stringValue'in v?v.stringValue:'integerValue'in v?Number(v.integerValue):'doubleValue'in v?v.doubleValue:'booleanValue'in v?v.booleanValue:'arrayValue'in v?(v.arrayValue.values||[]).map(dec):'mapValue'in v?decF(v.mapValue.fields):null;
 const decF=f=>{const o={};for(const k in(f||{}))o[k]=dec(f[k]);return o};
 async function call(method,url,body,timeout=25000){
  if(!auth||!auth.currentUser){const e=new Error('not signed in');e.code='unauthenticated';throw e}
  const tok=await auth.currentUser.getIdToken();
  for(let attempt=0;attempt<2;attempt++){
   const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeout);let r;
   try{r=await fetch(url,{method,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:ctl.signal})}
   catch(x){clearTimeout(t);if(attempt===0&&x.name!=='AbortError')continue;const e=new Error(x.name==='AbortError'?'انتهت مهلة الاتصال':'network');e.code='unavailable';throw e}
   clearTimeout(t);
   if(r.ok)return r.status===204?{}:r.json();
   let j={};try{j=await r.json()}catch(_){}const msg=(j.error&&j.error.message)||('http '+r.status);
   if(r.status>=500&&attempt===0)continue;
   const e=new Error(msg);e.status=r.status;e.code=r.status===403?'permission-denied':r.status===401?'unauthenticated':r.status===404?'not-found':r.status===429?'resource-exhausted':'unavailable';throw e}}
 const mask=keys=>keys.map(k=>'updateMask.fieldPaths='+encodeURIComponent(k)).join('&');
 let bt=0;const bump=r=>{if(r&&(r.c==='stats'||r.path==='site/meta'))return;clearTimeout(bt);bt=setTimeout(()=>{call('PATCH',BASE+'/site/meta?updateMask.fieldPaths=rev',{fields:{rev:{integerValue:String(Date.now())}}}).catch(()=>{})},400)};
 return{
  doc:(d,c,i)=>({c,i,path:c+'/'+i}),
  collection:(d,c)=>({c}),
  async getDoc(r){try{const j=await call('GET',BASE+'/'+r.path);const data=decF(j.fields);return{id:r.i,exists:()=>true,data:()=>data}}
   catch(e){if(e.status===404&&/Document/i.test(e.message))return{id:r.i,exists:()=>false,data:()=>undefined};throw e}},
  async getDocs(c){let docs=[],tok='';do{const j=await call('GET',BASE+'/'+c.c+'?pageSize=300'+(tok?'&pageToken='+tok:''));(j.documents||[]).forEach(d=>{const data=decF(d.fields);docs.push({id:d.name.split('/').pop(),data:()=>data})});tok=j.nextPageToken||''}while(tok);return{docs}},
  async setDoc(r,data,o){const f=encF(data);if(o&&o.merge){await call('PATCH',BASE+'/'+r.path+'?'+mask(Object.keys(f)),{fields:f},60000)}else await call('PATCH',BASE+'/'+r.path,{fields:f},60000);bump(r)},
  async updateDoc(r,data){const f=encF(data);await call('PATCH',BASE+'/'+r.path+'?'+mask(Object.keys(f)),{fields:f},60000);bump(r)},
  async deleteDoc(r){await call('DELETE',BASE+'/'+r.path);bump(r)},
  writeBatch(){const ops=[];return{update:(r,data)=>{const f=encF(data);ops.push({update:{name:`projects/${CFG.projectId}/databases/(default)/documents/${r.path}`,fields:f},updateMask:{fieldPaths:Object.keys(f)}})},commit:async()=>{await call('POST',BASE+':commit',{writes:ops},60000);bump({})}}}
 }}

 return'تعذر الرفع ('+(c||(e&&e.message)||'خطأ')+')'}

const CLD={cloud:'',preset:''}; /* ضع Cloud name و Upload preset هون، أو أدخلهم مرة وحدة وبينحفظوا بالمتصفح */
const cldGet=()=>{let c=CLD.cloud,p=CLD.preset;try{c=c||localStorage.getItem('cld_c')||'';p=p||localStorage.getItem('cld_p')||''}catch(_){}return{c:c.trim(),p:p.trim()}};
function cldAsk(){const o=cldGet();if(o.c&&o.p)return o;const c=(prompt('Cloudinary — Cloud name:',o.c)||'').trim();if(!c)return null;const p=(prompt('Cloudinary — Upload preset (Unsigned):',o.p)||'').trim();if(!p)return null;try{localStorage.setItem('cld_c',c);localStorage.setItem('cld_p',p)}catch(_){}return{c,p}}
const cldOpt=u=>u.replace('/upload/','/upload/q_auto,f_auto/');
function upload(folder,blob,onProgress,ask){let xhr;const p=new Promise((res,rej)=>{const o=ask?cldAsk():cldGet();if(!o||!o.c||!o.p){rej({code:'storage/none'});return}
 const fd=new FormData();fd.append('file',blob);fd.append('upload_preset',o.p);fd.append('folder','portfolio/'+folder);
 xhr=new XMLHttpRequest();xhr.open('POST',`https://api.cloudinary.com/v1_1/${encodeURIComponent(o.c)}/auto/upload`);
 xhr.upload.onprogress=ev=>{if(ev.lengthComputable&&onProgress)onProgress(ev.loaded/ev.total)};
 xhr.onload=()=>{let j={};try{j=JSON.parse(xhr.responseText)}catch(_){}
  if(xhr.status>=200&&xhr.status<300&&j.secure_url)res({url:cldOpt(j.secure_url),path:'cld:'+j.public_id});
  else rej({code:'cld',message:(j.error&&j.error.message)||('http '+xhr.status)})};
 xhr.onerror=()=>rej({code:'network',message:'ما في اتصال بالإنترنت'});xhr.onabort=()=>rej({code:'storage/canceled'});xhr.timeout=1800000;xhr.ontimeout=()=>rej({code:'network',message:'انتهت مهلة الرفع'});
 xhr.send(fd)});
 p.cancel=()=>xhr&&xhr.abort();return p}

 const _o=cldGet();if(!_o.c||!_o.p||noStorage)return{url:dataUrl,path:''};
 try{const blob=await(await fetch(dataUrl)).blob();const ext=blob.type.includes('webp')?'webp':blob.type.includes('png')?'png':'jpg';return await upload(folder,blob)}
 catch(e){return{url:dataUrl,path:''}}}

/* ---- image compression ---- */
async function loadBmp(file){if(window.createImageBitmap){try{return await createImageBitmap(file)}catch(e){}}
 return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u})}
async function compress(file,{maxW=1400,maxH=1400,limit=760000,alpha=false,q0=.86,webp=false}={}){
 const bmp=await loadBmp(file);const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;let scale=Math.min(1,maxW/w0,maxH/h0),q=q0;
 for(let i=0;i<9;i++){const w=Math.max(1,Math.round(w0*scale)),h=Math.max(1,Math.round(h0*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  let out;if(alpha){x.drawImage(bmp,0,0,w,h);out=c.toDataURL('image/webp',q);if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/png')}
  else{x.fillStyle='#07101b';x.fillRect(0,0,w,h);x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,w,h);out=webp?c.toDataURL('image/webp',q):'';if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/jpeg',q)}
  if(out.length<=limit)return out;q=Math.max(.5,q-.05);scale*=q0>.9?.92:.86}
 throw new Error('الصورة كبيرة، جرّب صورة أصغر')}
function videoPoster(file){return new Promise((res,rej)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';const u=URL.createObjectURL(file);v.src=u;let fin=false;const done=(f,x)=>{if(fin)return;fin=true;URL.revokeObjectURL(u);f(x)};
 v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(e){done(rej,e)}};
 v.onseeked=()=>{try{const w=900,h=Math.round(w*((v.videoHeight/v.videoWidth)||9/16));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);done(res,c.toDataURL('image/jpeg',.8))}catch(e){done(rej,e)}};
 v.onerror=()=>done(rej,new Error('x'));setTimeout(()=>done(rej,new Error('t')),8000)})}

async function loadOne(n){
 if(n==='works'){const w=await fb.getDocs(fb.collection(db,'works'));S.works=w.docs.map(d=>({id:d.id,...d.data()}));sortWorks();return}
 if(n==='stats'){try{const st=await fb.getDoc(fb.doc(db,'stats','total'));S.stats=st.exists()?st.data():{}}catch(e){S.stats={}}return}
 const s=await fb.getDoc(fb.doc(db,'site',n));S.exists[n]=s.exists();S[n]={...clone(DEF[n]),...(s.exists()?s.data():{})};
 if(n==='ticker'&&!Array.isArray(S[n].items))S[n].items=clone(DEF.ticker.items);if(n==='about'&&!Array.isArray(S[n].chips))S[n].chips=[];if(n==='contact'&&!Array.isArray(S[n].links))S[n].links=[]}
function need(names){return Promise.all(names.map(n=>LOADED[n]||(LOADED[n]=loadOne(n).catch(e=>{delete LOADED[n];throw e}))))}
async function go(id){if(!P[id])id='overview';cur=id;if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);document.body.classList.remove('nav-open');renderNav();$('#ptitle').textContent=NAV.find(x=>x[0]===id)[1];
 const v=$('#view');scrollTo(0,0);
 if(!REQ[id].every(n=>LOADED[n]&&LOADED[n].done)){v.innerHTML='<div class="empty"><div class="spin" style="margin:0 auto"></div></div>';clearTimeout(go.t);go.t=setTimeout(()=>{if(cur===id&&$('.spin',v))v.insertAdjacentHTML('beforeend','<div class="empty" style="padding-top:6px">الاتصال بطيء… ما زلنا نحاول</div>')},6000);
  try{await need(REQ[id]);REQ[id].forEach(n=>{if(LOADED[n])LOADED[n].done=true})}catch(e){if(cur===id)v.innerHTML=`<div class="empty">${esc(errMsg(e))}<br><br><button class="btn" id="retry" type="button">إعادة المحاولة</button></div>`;const r=$('#retry');if(r)r.onclick=()=>go(id);return}}
 if(cur!==id)return;v.innerHTML='';P[id](v)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const s=e.target.closest('[data-save]');if(s)saveDoc(s.dataset.save,s)});
$('#burger').onclick=()=>document.body.classList.toggle('nav-open');$('#scrim').onclick=()=>document.body.classList.remove('nav-open');
const clean=o=>JSON.parse(JSON.stringify(o));
async function saveDoc(name,btn){btn.disabled=true;const old=btn.textContent;btn.textContent='جاري الحفظ…';
 try{if(name==='ticker'){S.ticker.items=S.ticker.items.filter(i=>i.icon||i.img).map(i=>{const o={label:(i.label||'').trim()};if(i.img)o.img=i.img;else o.icon=i.icon;return o});await fb.setDoc(fb.doc(db,'site','ticker'),clean(S.ticker))}
  else if(name==='about'){S.about.chips=S.about.chips.filter(Boolean);await fb.setDoc(fb.doc(db,'site','about'),clean(S.about))}
  else if(name==='contact'){S.contact.links=S.contact.links.filter(l=>((l.label||'').trim()||l.img)&&(l.url||'').trim()).map(l=>{const o={label:(l.label||'').trim(),url:l.url.trim()};if(l.img)o.img=l.img;return o});await fb.setDoc(fb.doc(db,'site','contact'),clean(S.contact))}
  else await fb.setDoc(fb.doc(db,'site',name),clean(S[name]));
  S.exists[name]=true;await commitTrash(PT);setDirty(false);toast('تم الحفظ ✓','good');if(name==='ticker'||name==='contact')go(cur)}
 catch(e){toast(errMsg(e),'bad')}
 btn.disabled=false;btn.textContent=old}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ================= Auth ================= */
const AERR={'auth/invalid-credential':'الإيميل أو كلمة المرور غير صحيحة','auth/wrong-password':'كلمة المرور غير صحيحة','auth/user-not-found':'ما في حساب بهذا الإيميل','auth/invalid-email':'صيغة الإيميل غير صحيحة','auth/too-many-requests':'محاولات كثيرة — جرّب بعد شوي','auth/network-request-failed':'ما في اتصال بالإنترنت','auth/operation-not-supported-in-this-environment':'افتح اللوحة من رابط الموقع المستضاف (https) وليس كملف','auth/unauthorized-domain':'هذا الدومين غير مضاف في Authorized domains','auth/operation-not-allowed':'فعّل Email/Password من Firebase → Authentication'};
function showFatal(msg){$('#boot').hidden=true;$('#login').hidden=false;$('#lform').innerHTML=`<p class="err" style="min-height:0">${msg}</p>`}
async function boot(){
 try{const imp=u=>import(SDK+u);const [A,Au,St]=await Promise.all([imp('firebase-app.js'),imp('firebase-auth.js'),Promise.resolve(null)]);
  const app=A.initializeApp(CFG);fb={...Au,...(St||{})};auth=fb.getAuth(app);Object.assign(fb,makeRest());db=null;
  storage=true}
 catch(e){showFatal('تعذر تحميل Firebase. تأكد من الاتصال بالإنترنت وأعد المحاولة.');return}
 fb.onAuthStateChanged(auth,u=>{user=u;$('#boot').hidden=true;
  if(!u){$('#app').hidden=true;$('#login').hidden=false;return}
  $('#login').hidden=true;$('#app').hidden=false;const h=location.hash.slice(1);go(P[h]?h:'overview');
  setTimeout(()=>{['hero','ticker','about','contact','cv','works'].forEach(n=>need([n]).then(()=>{if(LOADED[n])LOADED[n].done=true}).catch(()=>{}))},2500)})}
$('#lform').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lbtn'),er=$('#lerr');er.textContent='';er.style.color='';const em=$('#lem').value.trim(),pw=$('#lpw').value;if(!em||!pw){er.textContent='اكتب الإيميل وكلمة المرور';return}
 b.disabled=true;b.textContent='جاري الدخول…';try{await fb.signInWithEmailAndPassword(auth,em,pw)}catch(x){er.textContent=AERR[x.code]||('تعذر الدخول ('+(x.code||'خطأ')+')')}b.disabled=false;b.textContent='دخول'});
$('#lreset').addEventListener('click',async()=>{const er=$('#lerr'),em=$('#lem').value.trim();if(!em){er.style.color='';er.textContent='اكتب إيميلك أولاً';return}try{await fb.sendPasswordResetEmail(auth,em);er.style.color='var(--green)';er.textContent='أرسلنا رابط استعادة كلمة المرور لإيميلك'}catch(x){er.style.color='';er.textContent=AERR[x.code]||'تعذر الإرسال'}});
$('#logout').addEventListener('click',async()=>{if(dirty&&!confirm('في تغييرات غير محفوظة، تسجيل الخروج؟'))return;setDirty(false);await fb.signOut(auth)});
boot();

</script>
</body>
